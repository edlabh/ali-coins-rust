[package]
name = "ali-coins-browser"
description = "Camada de browser do ali-coins-rust: trait BrowserDriver + implementação CDP."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
ali-coins-core = { path = "../ali-coins-core" }
async-trait = "0.1"
chromiumoxide = "0.9"
futures = "0.3"
regex = "1"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time"] }
url = "2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
