[package]
name = "ali-coins-flows"
description = "Fluxos de negócio do ali-coins-rust: check-in e tarefas do AliExpress."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
ali-coins-core = { path = "../ali-coins-core" }
ali-coins-browser = { path = "../ali-coins-browser" }
async-trait = "0.1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time"] }

[dev-dependencies]
tempfile = "3"
