[package]
name = "ali-coins-cli"
description = "Binário ali-coins: orquestração (all/checkin/tasks) e sessões (export/import)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "ali-coins"
path = "src/main.rs"

[dependencies]
ali-coins-core = { path = "../ali-coins-core" }
ali-coins-browser = { path = "../ali-coins-browser" }
ali-coins-flows = { path = "../ali-coins-flows" }
clap = "4"
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }
dotenvy = "0.15"
