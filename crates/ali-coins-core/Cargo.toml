[package]
name = "ali-coins-core"
description = "Núcleo sem browser do ali-coins-rust (config, cripto, sessão, lock, relatórios)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
aes-gcm = "0.10"
base64 = "0.22"
chrono = { version = "0.4", features = ["clock"] }
chrono-tz = "0.10"
rand = "0.9"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "http2"] }
scrypt = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "time"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["user", "hostname", "signal"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time"] }
