[package]
name = "ali-coins-core"
description = "Núcleo sem browser do ali-coins-rust (config, cripto, sessão, lock, relatórios)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
aes-gcm = "0.10"
base64 = "0.22"
rand = "0.9"
scrypt = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
url = "2"
zeroize = "1"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.30", features = ["user"] }

[dev-dependencies]
tempfile = "3"
