name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint-and-test:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Toolchain (stable com rustfmt/clippy)
        run: rustup toolchain install 1.99.0 --component rustfmt,clippy --profile minimal

      - name: Cache de build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Formatação
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Testes
        run: cargo test --workspace

      - name: Auditoria de dependências (bloqueante)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: cargo audit
        run: cargo audit

      - name: Gitleaks (segredos no histórico)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  cross-platform:
    name: testes (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    needs: lint-and-test
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain (pinada 1.99.0)
        shell: bash
        run: rustup toolchain install 1.99.0 --profile minimal

      - name: Cache de build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Testes
        shell: bash
        run: cargo test --workspace

  coverage:
    name: cobertura (gate progressivo)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain (llvm-tools)
        run: rustup toolchain install 1.99.0 --profile minimal --component llvm-tools

      - name: Cache de build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-coverage-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-coverage-

      - uses: taiki-e/install-action@cargo-llvm-cov

      # Gate progressivo: impede regressão enquanto a meta de 80% não é
      # atingida (CLI/CDP dependem de browser real; ver docs/03-roadmap.md).
      - name: Cobertura de linhas
        run: cargo llvm-cov --workspace --fail-under-lines 61 --summary-only

  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-cyclonedx

      - name: Gerar SBOM do workspace
        run: cargo cyclonedx --format json

      - name: Publicar SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: |
            **/*.cdx.json
            **/bom.json

  docker:
    name: build da imagem
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Build da imagem
        run: docker build -t ali-coins-rust:ci .
        env:
          DOCKER_BUILDKIT: "1"
      - name: Smoke do healthcheck (dry-run precisa de credenciais fake)
        run: |
          docker run --rm \
            -e ALI_USER=ci@example.com \
            -e ALI_PASSWORD=ci \
            -e ENCRYPT_LOCAL_SESSION=false \
            ali-coins-rust:ci --dry-run --json > /tmp/smoke.json
          head -5 /tmp/smoke.json
